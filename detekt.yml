detekt:
  config:
    - detekt.yml

  buildUponDefaultConfig: true
  allRules: false
  failFast: true
  autoCorrect: false

  baseline: baseline.xml

  comments:
    active: true
    absenseOfKDoc:
      active: true
      allowedDeclarations:
        - class
        - fun
        - val
        - var
      excludes:
        - "**/test/**"
        - "**/androidTest/**"
    absentKDocOnOverridden:
      active: false
    KDocReferencesNonPublicProperty:
      active: true
    undocumentedPublicFunction:
      active: true
    undocumentedPublicProperty:
      active: true
    undocumentedPublicClass:
      active: true

  complexity:
    active: true
    ComplexCondition:
      active: true
      threshold: 4
    ComplexInterface:
      active: true
      threshold: 10
      includeStaticDeclarations: false
      includePrivateDeclarations: false
    CyclomaticComplexMethod:
      active: true
      threshold: 15
      ignoreSingleWhenExpression: true
    LargeClass:
      active: true
      threshold: 600
    LongMethod:
      active: true
      threshold: 60
    LongParameterList:
      active: true
      functionThreshold: 6
      constructorThreshold: 7
    MethodOverloading:
      active: true
      threshold: 6
    NamedArguments:
      active: true
      threshold: 3
    NestedBlockDepth:
      active: true
      threshold: 4
    ReplaceSafeCallChainWithRun:
      active: true
    StringLiteralDuplication:
      active: true
      threshold: 3
    TooManyFunctions:
      active: true
      thresholdInFiles: 11
      thresholdInClasses: 11
      thresholdInInterfaces: 11
      thresholdInObjects: 11
      thresholdInEnums: 11

  coroutines:
    active: true
    GlobalCoroutineUsage:
      active: true
    InjectDispatcher:
      active: true
      dispatcherNames:
        - IO
        - Default
        - Main
        - Unconfined
    RedundantSuspendModifier:
      active: true
    SleepInsteadOfDelay:
      active: true
    SuspendFunWithCoroutineScopeReceiver:
      active: true
    SuspendFunWithFlowReturnType:
      active: true

  empty-blocks:
    active: true
    EmptyCatchBlock:
      active: true
      allowedExceptionNameRegex: "_|(ignore|expected).*"
    EmptyClassBlock:
      active: true
    EmptyDefaultConstructor:
      active: true
    EmptyDoWhileBlock:
      active: true
    EmptyElseBlock:
      active: true
    EmptyFinallyBlock:
      active: true
    EmptyForBlock:
      active: true
    EmptyFunctionBlock:
      active: true
      ignoreOverridden: false
    EmptyIfBlock:
      active: true
    EmptyInitBlock:
      active: true
    EmptyKtFile:
      active: true
    EmptySecondaryConstructor:
      active: true
    EmptyTryBlock:
      active: true
    EmptyWhenBlock:
      active: true
    EmptyWhileBlock:
      active: true

  exceptions:
    active: true
    ExceptionRaisedInUnexpectedLocation:
      active: true
      methodNames:
        - toString
        - hashCode
        - equals
        - finalize
    InstanceOfCheckForException:
      active: true
    NotImplementedDeclaration:
      active: false
    ObjectExtendsThrowable:
      active: true
    PrintStackTrace:
      active: true
    RethrowCaughtException:
      active: true
    ReturnFromFinally:
      active: true
    SwallowedException:
      active: true
      ignoredExceptionTypes:
        - InterruptedException
        - NumberFormatException
        - ParseException
        - MalformedURLException
      allowedExceptionNameRegex: "_|(ignore|expected).*"
    ThrowingExceptionFromFinally:
      active: true
    ThrowingExceptionInMain:
      active: true
    ThrowingExceptionsWithoutMessageOrCause:
      active: true
      exceptions:
        - IllegalArgumentException
        - IllegalStateException
        - IOException
    ThrowingNewInstanceOfSameException:
      active: true
    TooGenericExceptionCaught:
      active: true
      exceptionNames:
        - ArrayIndexOutOfBoundsException
        - Error
        - Exception
        - IllegalMonitorStateException
        - NullPointerException
        - IndexOutOfBoundsException
        - RuntimeException
        - Throwable
      allowedExceptionNameRegex: "_|(ignore|expected).*"
    TooGenericExceptionThrown:
      active: true
      exceptionNames:
        - Error
        - Exception
        - RuntimeException
        - Throwable

  naming:
    active: true
    BooleanPropertyNaming:
      active: true
      allowedNames: "is|has|can|should|will|must"
    ClassNaming:
      active: true
      classPattern: "[A-Z][a-zA-Z0-9]*"
    ConstructorParameterNaming:
      active: true
      parameterPattern: "[a-z][A-Za-z0-9]*"
      privateParameterPattern: "[a-z][A-Za-z0-9]*"
    EnumNaming:
      active: true
      enumEntryPattern: "[A-Z][_a-zA-Z0-9]*"
    ForbiddenClassName:
      active: true
      forbiddenName: []
    FunctionMaxLength:
      active: true
      maximumFunctionNameLength: 30
    FunctionMinLength:
      active: true
      minimumFunctionNameLength: 3
    FunctionNaming:
      active: true
      functionPattern: "[a-z][a-zA-Z0-9]*"
      exclude:
        - "test/**"
    FunctionParameterNaming:
      active: true
      parameterPattern: "[a-z][A-Za-z0-9]*"
    InvalidPackageDeclaration:
      active: true
      rootPackage: "com.squidink.alloy"
      requireRootInDeclaration: false
    LambdaParameterNaming:
      active: true
      parameterPattern: "[a-z][A-Za-z0-9]*"
    MatchingDeclarationName:
      active: true
      mustBeFirst: true
    MemberNameEqualsClassName:
      active: true
      ignoreOverridden: true
    NoNameShadowing:
      active: true
    NonBooleanPropertyPrefixedWithIs:
      active: true
    ObjectPropertyNaming:
      active: true
      constantPattern: "[A-Za-z][_A-Za-z0-9]*"
      propertyPattern: "[A-Za-z][_A-Za-z0-9]*"
      privatePropertyPattern: "_[A-Za-z][_A-Za-z0-9]*"
    PackageNaming:
      active: true
      packagePattern: "[a-z]+(\.[a-z][A-Za-z0-9]*)*"
    TopLevelPropertyNaming:
      active: true
      constantPattern: "[A-Z][_A-Z0-9]*"
      propertyPattern: "[A-Za-z][_A-Za-z0-9]*"
      privatePropertyPattern: "_[A-Za-z][_A-Za-z0-9]*"
    VariableMaxLength:
      active: true
      maximumVariableNameLength: 64
    VariableMinLength:
      active: true
      minimumVariableNameLength: 1
    VariableNaming:
      active: true
      variablePattern: "[a-z][A-Za-z0-9]*"
      privateVariablePattern: "(_)?[a-z][A-Za-z0-9]*"

  performance:
    active: true
    ArrayPrimitive:
      active: true
    CouldBeSequence:
      active: true
      threshold: 3
    ForEachOnRange:
      active: true
    SpreadOperator:
      active: true
    UnnecessaryTemporaryInstantiation:
      active: true

  potential-bugs:
    active: true
    AvoidReferentialEquality:
      active: true
    CastNullableToNonNullableType:
      active: true
    CastToNullableType:
      active: true
    Deprecation:
      active: true
    DontDowncastCollectionTypes:
      active: true
    DoubleMutabilityForCollection:
      active: true
      mutableTypes:
        - kotlin.collections.MutableList
        - kotlin.collections.MutableMap
        - kotlin.collections.MutableSet
        - java.util.ArrayList
        - java.util.LinkedHashSet
        - java.util.HashSet
        - java.util.LinkedHashMap
        - java.util.HashMap
    DuplicateCaseInWhenExpression:
      active: true
    ElseCaseInsteadOfExhaustiveWhen:
      active: true
    EqualsAlwaysReturnsTrueOrFalse:
      active: true
    EqualsWithHashCodeExist:
      active: true
    ExitOutsideMain:
      active: true
    ExplicitGarbageCollectionCall:
      active: true
    HasPlatformType:
      active: true
    HiddenConstructor:
      active: true
    ImplicitDefaultLocale:
      active: true
    ImplicitUnitReturnType:
      active: false
    InvalidRange:
      active: true
    IteratorHasNextCallsNextMethod:
      active: true
    IteratorNotThrowingNoSuchElementException:
      active: true
    LateinitUsage:
      active: true
      excludeAnnotatedProperties: []
      excludeObjectClasses: []
      excludeOnProperties: []
    MapGetWithNotNullAssertionOperator:
      active: true
    MissingWhenCase:
      active: true
      allowElseExpression: true
    NullableToStringCall:
      active: true
    RedundantElseInWhen:
      active: true
    UnconditionalJumpStatementInLoop:
      active: true
    UnnecessaryNotNullCheck:
      active: true
    UnnecessaryNotNullOperator:
      active: true
    UnnecessarySafeCall:
      active: true
    UnreachableCatchBlock:
      active: true
    UnreachableCode:
      active: true
    UnsafeCallOnNullableType:
      active: true
    UnsafeCast:
      active: true
    UselessPostfixExpression:
      active: true
    UselessSupertype:
      active: true
    WrongEqualsTypeParameter:
      active: true

  style:
    active: true
    CanBeNonNullable:
      active: true
    CascadingCallWrapping:
      active: true
      includeElvis: true
    ClassOrdering:
      active: true
    CollapsibleIfStatements:
      active: true
    DataClassContainsFunctions:
      active: true
      conversionFunctionPrefix:
        - to
    DataClassShouldBeImmutable:
      active: true
    DestructuringDeclarationWithTooManyEntries:
      active: true
      maxDestructuringEntries: 3
    EqualsNullCall:
      active: true
    EqualsOnSignatureLine:
      active: true
    ExplicitCollectionElementAccessMethod:
      active: true
    ExplicitItLambdaParameter:
      active: true
    ExpressionBodySyntax:
      active: true
      includeLineWrapping: false
    ForbiddenComment:
      active: true
      comments:
        - reason: "Forbidden FIXME todo marker in comment, please address the issue."
          value: "FIXME:"
        - reason: "Forbidden TODO todo marker in comment, please address the issue."
          value: "TODO:"
        - reason: "Forbidden OPTIMIZE marker in comment, please address the issue."
          value: "OPTIMIZE:"
        - reason: "Forbidden HACK marker in comment, please address the issue."
          value: "HACK:"
        - reason: "Forbidden TEMPORARY marker in comment, please address the issue."
          value: "TEMPORARY:"
      allowedPatterns: ""
    ForbiddenImport:
      active: true
      imports: []
      forbiddenPatterns: ""
    ForbiddenMethodCall:
      active: true
      methods:
        - reason: "`print` and `println` do not respect log level and are not configurable."
          value: "kotlin.io.print"
        - reason: "`print` and `println` do not respect log level and are not configurable."
          value: "kotlin.io.println"
    ForbiddenVoid:
      active: true
      ignoreOverridden: true
      ignoreUsageInGenerics: false
    FunctionOnlyReturningConstant:
      active: true
      ignoreOverridableFunction: true
      ignoreActualFunction: true
      excludedFunctions: ""
    LoopWithTooManyJumpStatements:
      active: true
      maxJumpCount: 1
    MagicNumber:
      active: true
      ignoreNumbers:
        - "-1"
        - "0"
        - "1"
        - "2"
      ignoreHashCodeFunction: true
      ignorePropertyDeclaration: false
      ignoreLocalVariableDeclaration: false
      ignoreConstantDeclaration: true
      ignoreCompanionObjectPropertyDeclaration: true
      ignoreAnnotation: false
      ignoreNamedArgument: true
      ignoreEnums: false
      ignoreRanges: false
      ignoreExtensionFunctions: true
    MandatoryBracesIfStatements:
      active: true
    MandatoryBracesLoops:
      active: true
    MaxChainedCallsOnSameLine:
      active: true
      maxChainedCalls: 5
    MaxLineLength:
      active: true
      maxLineLength: 120
      excludePackageStatements: true
      excludeImportStatements: true
      excludeCommentStatements: false
    MayBeConst:
      active: true
    NestedClassesVisibility:
      active: true
    NewLineAtEndOfFile:
      active: true
    NoTabs:
      active: true
    ObjectLiteralToLambda:
      active: true
    OptionalAbstractKeyword:
      active: true
    OptionalUnit:
      active: false
    PreferToOverPairSyntax:
      active: true
    ProtectedMemberInFinalClass:
      active: true
    RedundantExplicitType:
      active: true
    RedundantHigherOrderMapUsage:
      active: true
    RedundantVisibilityModifierRule:
      active: false
    ReturnCount:
      active: true
      max: 2
      excludedFunctions:
        - "equals"
      excludeLabeled: false
      excludeReturnFromLambda: true
      excludeGuardClauses: false
    SafeCast:
      active: true
    SerialVersionUIDInSerializableClass:
      active: true
    SpacingBetweenPackageAndImports:
      active: true
    ThrowsCount:
      active: true
      max: 2
      excludeGuardClauses: false
    TrailingWhitespace:
      active: true
    TrimMultilineRawString:
      active: true
    UnderscoresInNumericLiterals:
      active: true
      acceptableLength: 4
      allowNonStandardGrouping: false
    UnnecessaryAbstractClass:
      active: true
    UnnecessaryAnnotationUseSiteTarget:
      active: true
    UnnecessaryApply:
      active: true
    UnnecessaryBracesAroundTrailingLambda:
      active: true
    UnnecessaryFilter:
      active: true
    UnnecessaryInheritance:
      active: true
    UnnecessaryInnerClass:
      active: true
    UnnecessaryLet:
      active: true
    UnnecessaryParentheses:
      active: true
    UntilInsteadOfRangeTo:
      active: true
    UnusedImports:
      active: true
    UnusedParameter:
      active: true
      allowedNames: "ignored|expected"
    UnusedPrivateClass:
      active: true
    UnusedPrivateMember:
      active: true
      allowedNames: ""
    UnusedPrivateProperty:
      active: true
      allowedNames: "_|ignored|expected|serialVersionUID"
    UseAnyOrNoneInsteadOfFind:
      active: true
    UseArrayLiteralsInAnnotations:
      active: true
    UseCheckNotNull:
      active: true
    UseCheckOrError:
      active: true
    UseDataClass:
      active: true
      allowVars: false
    UseEmptyCounterpart:
      active: true
    UseIfEmptyOrIfBlank:
      active: true
    UseIfInsteadOfWhen:
      active: true
    UseIsNullOrEmpty:
      active: true
    UseOrEmpty:
      active: true
    UseRequire:
      active: true
    UseRequireNotNull:
      active: true
    UseSumOfInsteadOfFlatMapSize:
      active: true
    UselessCallOnNotNull:
      active: true
    UtilityClassWithPublicConstructor:
      active: true
    VarCouldBeVal:
      active: true
    WildcardImport:
      active: true
      excludeImports:
        - "java.util.*"

  compose:
    # Custom Compose rules
    active: true
    ComposableFunctionNaming:
      active: true
      allowedNames: ".*"
    CompositionLocalAllowlist:
      active: true
      allowedCompositionLocals:
        - LocalSomething
    CompositionLocalNaming:
      active: true
    ContentEmitterReturningValues:
      active: true
    ModifierComposable:
      active: true
    ModifierMissing:
      active: true
      checkModifiersForVisibility:
        - public
        - protected
    ModifierReused:
      active: true
    ModifierWithoutDefault:
      active: true
    MultipleEmitters:
      active: true
    MutableParams:
      active: true
    ComposeNaming:
      active: true
    ComposableParamOrder:
      active: true
    PreviewNaming:
      active: true
    PreviewPublic:
      active: true
    RememberMissing:
      active: true
    UnstableCollections:
      active: true
    ViewModelForwarding:
      active: true
    ViewModelInjection:
      active: true
