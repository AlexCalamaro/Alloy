# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official

# Android SDK
android.useAndroidX=true
android.enableJetifier=false

# KSP Compatibility (required for Kotlin 2.0.21)
# Suppresses: "Using kotlin.sourceSets DSL to add Kotlin sources is not allowed with built-in Kotlin"
android.disallowKotlinSourceSets=false

# Suppress AGP warnings about experimental/deprecated options
android.sync.suppressAggWarnings=UNSUPPORTED_PROJECT_OPTION_USE
android.sync.suppressAggWarnings=GENERIC
